apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulsecheck-backend-hpa
  namespace: pulsecheck
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulsecheck-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulsecheck-frontend-hpa
  namespace: pulsecheck
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulsecheck-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
